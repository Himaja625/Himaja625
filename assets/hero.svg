<svg width="1200" height="520" viewBox="0 0 1200 520"
     fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Background -->
  <linearGradient id="background"
      x1="0" y1="0"
      x2="1200" y2="520"
      gradientUnits="userSpaceOnUse">
    <stop stop-color="#FCFBFF"/>
    <stop offset="0.52" stop-color="#F7F4FF"/>
    <stop offset="1" stop-color="#F1EEFC"/>
  </linearGradient>

  <!-- Soft glows -->
  <radialGradient id="lavenderGlow">
    <stop stop-color="#B9ACFF" stop-opacity="0.38"/>
    <stop offset="1" stop-color="#B9ACFF" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="pinkGlow">
    <stop stop-color="#F4B9D7" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#F4B9D7" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop stop-color="#A8CFFF" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#A8CFFF" stop-opacity="0"/>
  </radialGradient>

  <!-- Grid -->
  <pattern id="grid"
      width="28"
      height="28"
      patternUnits="userSpaceOnUse">

    <path
      d="M28 0H0V28"
      stroke="#74708F"
      stroke-opacity="0.055"/>

  </pattern>

  <!-- Laptop screen -->
  <linearGradient id="screen"
      x1="690" y1="170"
      x2="1030" y2="380"
      gradientUnits="userSpaceOnUse">
    <stop stop-color="#25263C"/>
    <stop offset="1" stop-color="#111321"/>
  </linearGradient>

  <!-- Chart -->
  <linearGradient id="chart"
      x1="720" y1="350"
      x2="1000" y2="220"
      gradientUnits="userSpaceOnUse">
    <stop stop-color="#8F82F5"/>
    <stop offset="0.5" stop-color="#63D0D0"/>
    <stop offset="1" stop-color="#F0A5CA"/>
  </linearGradient>

  <!-- Shadows -->
  <filter id="cardShadow"
      x="-30%" y="-30%"
      width="160%" height="180%">

    <feDropShadow
      dx="0"
      dy="10"
      stdDeviation="14"
      flood-color="#625D78"
      flood-opacity="0.12"/>

  </filter>

  <filter id="laptopShadow"
      x="-30%" y="-30%"
      width="170%"
      height="180%">

    <feDropShadow
      dx="0"
      dy="15"
      stdDeviation="18"
      flood-color="#56536C"
      flood-opacity="0.18"/>

  </filter>

  <!-- Animations -->
  <style>

    .floatOne {
      animation: floatOne 5s ease-in-out infinite;
    }

    .floatTwo {
      animation: floatTwo 6s ease-in-out infinite;
    }

    .softPulse {
      animation: softPulse 3.5s ease-in-out infinite;
    }

    .drawChart {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: drawChart 2.8s ease-out forwards;
    }

    @keyframes floatOne {
      0%,100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes floatTwo {
      0%,100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(6px);
      }
    }

    @keyframes softPulse {
      0%,100% {
        opacity: 0.45;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes drawChart {
      to {
        stroke-dashoffset: 0;
      }
    }

  </style>

</defs>


