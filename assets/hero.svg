<svg width="1200" height="470" viewBox="0 0 1200 470" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="70" y1="40" x2="1120" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F7F4EF"/>
    <stop offset="0.52" stop-color="#EEF0F7"/>
    <stop offset="1" stop-color="#E9E5F3"/>
  </linearGradient>
  <linearGradient id="desk" x1="650" y1="190" x2="1080" y2="410" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#D9D9E8"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#20243A"/>
    <stop offset="1" stop-color="#4C426D"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#55506A" flood-opacity=".18"/>
  </filter>
  <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#55506A" flood-opacity=".14"/>
  </filter>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#7C83A3" fill-opacity=".13"/>
  </pattern>
</defs>

<!-- warm, human background -->
<rect width="1200" height="470" rx="30" fill="url(#bg)"/>
<rect x="28" y="28" width="1144" height="414" rx="24" fill="url(#dots)"/>

<!-- soft decorative shapes -->
<circle cx="1030" cy="75" r="88" fill="#C9C3F2" fill-opacity=".22"/>
<circle cx="1080" cy="112" r="42" fill="#F2A7C5" fill-opacity=".16"/>
<circle cx="700" cy="430" r="120" fill="#A7DCD7" fill-opacity=".12"/>

<!-- left text -->
<text x="72" y="82" fill="#77758A" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4">DATA SCIENCE STUDENT</text>
<text x="72" y="145" fill="#242536" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700">Hey, I'm Himaja.</text>
<text x="72" y="187" fill="#55566A" font-family="Arial, Helvetica, sans-serif" font-size="19">I like figuring things out,</text>
<text x="72" y="216" fill="#55566A" font-family="Arial, Helvetica, sans-serif" font-size="19">building little experiments,</text>
<text x="72" y="245" fill="#55566A" font-family="Arial, Helvetica, sans-serif" font-size="19">and learning as I go.</text>

<!-- handwritten-ish note -->
<g transform="rotate(-4 280 323)" filter="url(#smallShadow)">
  <rect x="72" y="284" width="355" height="92" rx="14" fill="#FFFDF8"/>
  <path d="M98 350 C140 337 171 358 211 346 C249 335 279 356 319 343" stroke="#D7D1C6" stroke-width="1.4" fill="none"/>
  <text x="98" y="318" fill="#343448" font-family="Arial, Helvetica, sans-serif" font-size="16">learn → build → understand → repeat</text>
  <text x="98" y="343" fill="#9894A4" font-family="Arial, Helvetica, sans-serif" font-size="12">still figuring it out, honestly :)</text>
</g>

<!-- 3D desk plane -->
<path d="M548 330 L1060 238 L1144 374 L625 455 Z" fill="url(#desk)" stroke="#D0CEDC" stroke-width="1" filter="url(#shadow)"/>

<!-- laptop base -->
<path d="M704 307 L962 264 L1017 331 L757 378 Z" fill="#B9BAC9" stroke="#9698AA"/>
<path d="M728 300 L950 263 L986 310 L765 346 Z" fill="#77798C"/>

<!-- laptop screen -->
<g filter="url(#shadow)">
  <path d="M720 297 L932 260 L915 173 L702 210 Z" fill="#292C3F"/>
  <path d="M731 285 L921 252 L906 187 L717 220 Z" fill="url(#screen)"/>
</g>

<!-- screen graph -->
<g opacity=".9">
  <path d="M744 263 L779 246 L811 252 L848 214 L884 230" stroke="#A7DCD7" stroke-width="3" fill="none"/>
  <circle cx="744" cy="263" r="4" fill="#F2A7C5"/>
  <circle cx="779" cy="246" r="4" fill="#A7DCD7"/>
  <circle cx="811" cy="252" r="4" fill="#A7DCD7"/>
  <circle cx="848" cy="214" r="4" fill="#C9C3F2"/>
  <circle cx="884" cy="230" r="4" fill="#F2A7C5"/>
  <text x="744" y="239" fill="#E8E8F1" font-family="Arial, Helvetica, sans-serif" font-size="9">experiment_07</text>
</g>

<!-- floating skill cards -->
<g filter="url(#smallShadow)">
  <g transform="rotate(-5 970 119)">
    <rect x="924" y="76" width="116" height="58" rx="13" fill="#FFFDF8"/>
    <text x="946" y="101" fill="#6C6684" font-family="Arial, Helvetica, sans-serif" font-size="11">currently</text>
    <text x="946" y="119" fill="#29293A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Python</text>
  </g>
  <g transform="rotate(6 1070 190)">
    <rect x="1014" y="160" width="116" height="58" rx="13" fill="#FFFDF8"/>
    <text x="1034" y="185" fill="#6C6684" font-family="Arial, Helvetica, sans-serif" font-size="11">exploring</text>
    <text x="1034" y="203" fill="#29293A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">ML + Data</text>
  </g>
</g>

<!-- tiny plant: intentionally simple/human -->
<g transform="translate(1070 320)">
  <path d="M0 38 C2 20 3 9 8 -3" stroke="#748F7E" stroke-width="3" stroke-linecap="round"/>
  <path d="M7 10 C-7 2 -13 9 -14 19 C-3 20 4 17 7 10Z" fill="#9BBBA7"/>
  <path d="M8 1 C15 -11 24 -8 27 1 C18 7 12 6 8 1Z" fill="#A9C9B4"/>
  <path d="M-1 31 C-13 25 -19 30 -20 39 C-10 42 -4 38 -1 31Z" fill="#8FAF9B"/>
  <path d="M-17 40 H23" stroke="#B8B3C2" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- small signature -->
<text x="72" y="417" fill="#9996A6" font-family="Arial, Helvetica, sans-serif" font-size="12">quiet work · clear direction</text>

<rect x="1" y="1" width="1198" height="468" rx="29" stroke="#D6D2DE" stroke-width="2"/>
</svg>