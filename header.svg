<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B1020"/>
    <stop offset="0.52" stop-color="#111936"/>
    <stop offset="1" stop-color="#090D18"/>
  </linearGradient>
  <linearGradient id="glow" x1="250" y1="60" x2="970" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7C83FF"/>
